vich_uploader:
    db_driver: orm
    metadata:
        type:
            attribute
    mappings:
        product_images:
            uri_prefix: '/uploads/images/products'
            upload_destination: '%kernel.project_dir%/uploads/images/products'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

        product_variation_images:
            uri_prefix: '/uploads/images/product_variation_images'
            upload_destination: '%kernel.project_dir%/uploads/images/product_variation_images'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true
